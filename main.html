<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<style>
		.map-overlay-rect {
			position: absolute;
			top: 3%;
			left: 66%;
			width: 32%;
			height: 90%;
			border: 3px solid transparent;
			background-color: transparent;
			transition: background-color 0.2s ease, border-color 0.2s ease;
			cursor: pointer;
		}

		.map-overlay-rect.active {
			background-color: rgba(25, 135, 84, 0.35);
			border-color: #198754;
		}
	</style>
</head>
<body class="d-flex flex-column align-items-center">
	<h1 class="mb-2">TODO: Welcome to Project bla bla Portal</h1>
	<div class="position-relative d-inline-block">
		<img id="mainMap" src="map.jpg" alt="Map" class="d-block mx-auto img-fluid" />
		<a href="#" id="mapToggleArea" class="map-overlay-rect" aria-label="Toggle highlighted map area"></a>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const mapToggleArea = document.getElementById('mapToggleArea');

		mapToggleArea.addEventListener('click', function(event) {
			event.preventDefault();
			mapToggleArea.classList.toggle('active');
		});
	</script>
</body>
</html>
