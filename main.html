<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<style>
		.map-overlay-rect {
			position: absolute;
			top: 3%;
			left: 66%;
			width: 32%;
			height: 90%;
			border: 3px solid transparent;
			background-color: transparent;
			transition: background-color 0.2s ease, border-color 0.2s ease;
			cursor: pointer;
		}

		.map-overlay-rect.active {
			background-color: rgba(25, 135, 84, 0.35);
			border-color: #198754;
		}

		.flex-wrapper {
			display: flex;
			flex-flow: row nowrap;
			gap: 16px;
			width: 100%;
			margin-top: 16px;
		}

		.single-chart {
			flex: 1 1 0;
			display: flex;
			justify-content: center;
		}

		.circular-chart {
			display: block;
			margin: 10px auto;
			width: 180px;
			height: 180px;
			max-width: 100%;
		}

		.circle-bg {
			fill: none;
			stroke: #eee;
			stroke-width: 3.8;
		}

		.circle {
			fill: none;
			stroke-width: 2.8;
			stroke-linecap: round;
			animation: progress 1s ease-out forwards;
		}

		@keyframes progress {
			0% {
				stroke-dasharray: 0 100;
			}
		}

		.circular-chart.red .circle {
			stroke: #dc3545;
		}

		.circular-chart.green .circle {
			stroke: #4CC790;
		}

		.circular-chart.blue .circle {
			stroke: #3c9ee5;
		}

		.percentage {
			fill: #666;
			font-family: sans-serif;
			font-size: 0.4em;
			text-anchor: middle;
		}
	</style>
</head>
<body class="d-flex flex-column align-items-center">
	<h1 class="mb-2">TODO: Welcome to Project bla bla Portal</h1>

	<p class="text-center mb-2"><span id="currentDate"></span></p>

	<div class="position-relative d-inline-block">
		<img id="mainMap" src="map.jpg" alt="Map" class="d-block mx-auto img-fluid" />
		<a href="#" id="mapToggleArea" class="map-overlay-rect" aria-label="Toggle highlighted map area"></a>
	</div>
	

	<div class="card shadow-sm mt-3 p-3" style="width: min(92vw, 900px);">
		<h2 class="h4 text-center mb-2">Building levels</h2>
		<div class="flex-wrapper mt-0">
			<div class="single-chart">
				<svg viewBox="0 0 36 36" class="circular-chart green">
				<path class="circle-bg"
					d="M18 2.0845
					a 15.9155 15.9155 0 0 1 0 31.831
					a 15.9155 15.9155 0 0 1 0 -31.831"
				/>
				<path class="circle"
					stroke-dasharray="30, 100"
					d="M18 2.0845
					a 15.9155 15.9155 0 0 1 0 31.831
					a 15.9155 15.9155 0 0 1 0 -31.831"
				/>
				<text x="18" y="18.5" class="percentage">
					<tspan x="18" dy="0">Lights</tspan>
					<tspan x="18" dy="1.3em">30%</tspan>
				</text>
				</svg>
			</div>

			<div class="single-chart">
				<svg viewBox="0 0 36 36" class="circular-chart red">
				<path class="circle-bg"
					d="M18 2.0845
					a 15.9155 15.9155 0 0 1 0 31.831
					a 15.9155 15.9155 0 0 1 0 -31.831"
				/>
				<path class="circle"
					stroke-dasharray="45, 100"
					d="M18 2.0845
					a 15.9155 15.9155 0 0 1 0 31.831
					a 15.9155 15.9155 0 0 1 0 -31.831"
				/>
				<text x="18" y="18.5" class="percentage">
					<tspan x="18" dy="0">Heating</tspan>
					<tspan x="18" dy="1.3em">45%</tspan>
				</text>
				</svg>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const mapToggleArea = document.getElementById('mapToggleArea');

		mapToggleArea.addEventListener('click', function(event) {
			event.preventDefault();
			mapToggleArea.classList.toggle('active');
		});
	</script>
	<script>
		const currentDate = new Date();
		document.getElementById('currentDate').textContent = currentDate.toDateString();
	</script>
</body>
</html>
