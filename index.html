<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
	<div class="d-flex flex-column align-items-center justify-content-center min-vh-100" style="background: linear-gradient(100deg, #efe4d1 0%, #dfe3df 45%, #c7dbef 100%);">
		<h1 class="mb-2">TODO: Welcome to Project bla bla Portal</h1>

		<main class="card p-5 shadow-sm" style="width: min(92vw, 430px);" aria-label="Login form">
			<span class="material-symbols-outlined d-block text-center text-primary mb-3" style="font-size: 240px; font-family: 'Material Symbols Outlined'; line-height: 1;">groups</span>

			<form action="#" method="post" id="loginForm">
				<div class="mb-3">
					<input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Username" autocomplete="username" required />
				</div>

				<div class="mb-3">
					<input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
					<div id="errorMessage" class="text-danger mt-2" style="display: none;"></div>
				</div>

				<button type="submit" class="btn btn-primary btn-lg rounded-pill d-block mx-auto">LOGIN</button>
			</form>
		</main>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		document.getElementById('loginForm').addEventListener('submit', function(e) {
			e.preventDefault();
			const username = document.getElementById('username').value;
			const password = document.getElementById('password').value;
			const errorMessage = document.getElementById('errorMessage');
			
			if (username === 'khadija' && password === 'Passw0rd!') {
				window.location.href = 'main.html';
			} else {
				errorMessage.textContent = 'Invalid username or password';
				errorMessage.style.display = 'block';
			}
		});
	</script>
</body>
</html>
